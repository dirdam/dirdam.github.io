<h2 class="card-block-title"><span class="card-block-icon"><svg><use href="#icon-keyboard"></use></svg></span><span data-i18n="sectionType"></span></h2>
<section id="type">
  <div class="content-card">
    <p data-i18n="testIntro"></p>
    <div class="form-field">
      <label for="font-test" class="visually-hidden" data-i18n="testAriaLabel"></label>
      <textarea id="font-test" class="font-cuchilleras" rows="3" data-i18n="testPlaceholder" data-i18n-attr="placeholder"></textarea>
    </div>

    <div class="cuchilleras-toggle-row">
      <div class="cuchilleras-font-toggle" role="group" aria-label="Font style">
        <button type="button" id="font-toggle-serif" class="font-cuchilleras" aria-pressed="true" data-i18n="toggleSerif"></button>
        <button type="button" id="font-toggle-sans" class="font-cuchilleras-sans" aria-pressed="false" data-i18n="toggleSans"></button>
      </div>
    </div>

    <div class="cuchilleras-sliders">
      <div class="cuchilleras-slider-row">
        <label class="cuchilleras-slider-label" for="font-size" data-i18n="sliderSize"></label>
        <div class="cuchilleras-slider-bar">
          <input type="range" id="font-size" min="14" max="40" step="1" value="24">
          <div id="font-size-value" class="cuchilleras-slider-value">24</div>
        </div>
      </div>
      <div class="cuchilleras-slider-row">
        <label class="cuchilleras-slider-label" for="font-weight" data-i18n="sliderWeight"></label>
        <div class="cuchilleras-slider-bar">
          <input type="range" id="font-weight" min="100" max="900" step="10" value="200">
          <div id="font-weight-value" class="cuchilleras-slider-value">200</div>
        </div>
      </div>
      <div class="cuchilleras-slider-row">
        <label class="cuchilleras-slider-label" for="font-width" data-i18n="sliderWidth"></label>
        <div class="cuchilleras-slider-bar">
          <input type="range" id="font-width" min="62" max="100" step="1" value="100">
          <div id="font-width-value" class="cuchilleras-slider-value">100%</div>
        </div>
      </div>
    </div>
  </div>
</section>
